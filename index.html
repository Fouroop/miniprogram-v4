<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题AI辅导 · MVP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F6F0E4'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23D64541' stroke-width='5'/%3E%3Cpath d='M22 34 L29 41 L44 25' fill='none' stroke='%23D64541' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=LXGW+WenKai+Screen:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== 纠错本 · 设计Token ===== */
:root{
  --paper:#F6F0E4;        /* 作业纸底色 */
  --paper-deep:#EFE6D4;   /* 纸加深 */
  --card:#FFFDF8;         /* 卡片纸面 */
  --ink:#2B2A26;          /* 墨色主文字 */
  --ink-soft:#6E675A;     /* 次级文字 */
  --ink-faint:#A69C89;    /* 弱文字 */
  --line:#E2D8C2;         /* 格线 */
  --line-strong:#CFC2A6;  /* 格线加深 */
  --red:#D64541;          /* 红笔批注 */
  --red-soft:#F7E3E0;
  --blue:#3B6EA5;         /* 蓝笔订正 */
  --blue-soft:#E3EDF7;
  --green:#4C8A5C;        /* 已掌握 */
  --green-soft:#E5F0E7;
  --amber:#C98A2D;
  --amber-soft:#F6ECD9;
  --radius:16px;
  --shadow:0 2px 10px rgba(66,54,30,.07);
  --shadow-lg:0 10px 30px rgba(66,54,30,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  background-image:
    linear-gradient(rgba(214,69,65,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(214,69,65,.035) 1px, transparent 1px);
  background-size:28px 28px;
  line-height:1.6;
}
.font-note{font-family:"LXGW WenKai Screen","KaiTi",serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* ===== 顶部栏 ===== */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(246,240,228,.92);
  backdrop-filter:blur(10px);
  border-bottom:2px solid var(--line);
  padding:10px 18px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:var(--card);border:2px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);
}
.brand b{font-weight:700}
.brand em{font-style:normal;color:var(--red)}
.topbar-right{display:flex;align-items:center;gap:8px}
.user-chip{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1.5px solid var(--line-strong);
  border-radius:999px;padding:4px 12px 4px 5px;font-size:13px;
}
.avatar{
  width:26px;height:26px;border-radius:50%;
  background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;
}
.vip-tag{
  font-size:10px;font-weight:700;color:var(--amber);
  background:var(--amber-soft);border:1px solid #E3C68F;
  border-radius:6px;padding:1px 5px;
}
.vip-tag.off{color:var(--ink-faint);background:var(--paper-deep);border-color:var(--line)}

/* ===== 主布局 ===== */
.layout{max-width:1100px;margin:0 auto;display:flex;gap:24px;padding:22px 18px 80px;min-height:calc(100vh - 60px)}
.sidebar{width:220px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;position:sticky;top:80px;align-self:flex-start}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;border-radius:12px;
  color:var(--ink-soft);font-size:14.5px;font-weight:500;
  border:1.5px solid transparent;transition:.15s;
}
.nav-item svg{width:19px;height:19px;flex-shrink:0}
.nav-item:hover{background:var(--paper-deep)}
.nav-item.active{
  background:var(--card);border-color:var(--line-strong);
  color:var(--ink);font-weight:700;box-shadow:var(--shadow);
}
.main{flex:1;min-width:0}

/* ===== 通用卡片 ===== */
.card{
  background:var(--card);border:1.5px solid var(--line);
  border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);
}
.card+.card{margin-top:16px}
.page-title{font-size:23px;font-weight:700;margin-bottom:4px}
.page-sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:18px}
.section-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::before{content:"";width:4px;height:16px;background:var(--red);border-radius:2px}

/* ===== 统计卡片 ===== */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.stat-card{
  background:var(--card);border:1.5px solid var(--line);
  border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
}
.stat-card .num{font-size:28px;font-weight:700;font-family:"LXGW WenKai Screen",serif;line-height:1.2}
.stat-card .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.stat-card.red .num{color:var(--red)}
.stat-card.blue .num{color:var(--blue)}
.stat-card.green .num{color:var(--green)}

/* ===== 科目分布 ===== */
.subject-bar{display:flex;flex-direction:column;gap:12px}
.subject-row{display:flex;align-items:center;gap:10px}
.subject-name{width:52px;font-size:13.5px;font-weight:500;flex-shrink:0}
.subject-track{flex:1;height:22px;background:var(--paper-deep);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.subject-fill{height:100%;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:11px;font-weight:700;color:#fff;min-width:26px;transition:width .6s}
.subject-count{width:36px;text-align:right;font-size:12.5px;color:var(--ink-soft);flex-shrink:0}

/* ===== 快捷入口 ===== */
.entry-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.entry{
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start;
  transition:.15s;text-align:left;
}
.entry:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--line-strong)}
.entry-ic{width:42px;height:42px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.entry-ic svg{width:22px;height:22px}
.entry-ic.red{background:var(--red-soft);color:var(--red)}
.entry-ic.blue{background:var(--blue-soft);color:var(--blue)}
.entry-ic.green{background:var(--green-soft);color:var(--green)}
.entry-ic.amber{background:var(--amber-soft);color:var(--amber)}
.entry h4{font-size:14.5px;font-weight:700;margin-bottom:2px}
.entry p{font-size:12px;color:var(--ink-soft)}
.entry .go{margin-left:auto;align-self:center;color:var(--ink-faint);flex-shrink:0}

/* ===== 错题列表 ===== */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{
  padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:500;
  background:var(--card);border:1.5px solid var(--line);color:var(--ink-soft);transition:.15s;
}
.chip:hover{border-color:var(--line-strong)}
.chip.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.mistake-card{
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px;display:block;width:100%;
  text-align:left;transition:.15s;
}
.mistake-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--line-strong)}
.mc-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px}
.badge.subject{background:var(--blue-soft);color:var(--blue)}
.badge.diff{background:var(--paper-deep);color:var(--ink-soft)}
.badge.status{background:var(--red-soft);color:var(--red)}
.badge.status.ok{background:var(--green-soft);color:var(--green)}
.badge.status.review{background:var(--amber-soft);color:var(--amber)}
.mc-stem{
  font-size:14px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-family:"LXGW WenKai Screen",serif;
}
.mc-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px;color:var(--ink-faint);font-size:12px}
.mc-bottom .reason{display:flex;align-items:center;gap:5px;color:var(--red)}
.mc-bottom .date{color:var(--ink-faint)}
.empty{
  text-align:center;padding:50px 20px;color:var(--ink-faint);
  background:var(--card);border:1.5px dashed var(--line-strong);border-radius:var(--radius);
}
.empty svg{width:44px;height:44px;margin-bottom:10px;opacity:.5}

/* ===== 上传识别 ===== */
.upload-zone{
  border:2.5px dashed var(--line-strong);border-radius:var(--radius);
  background:var(--card);padding:44px 20px;text-align:center;cursor:pointer;transition:.15s;
}
.upload-zone:hover,.upload-zone.drag{background:var(--blue-soft);border-color:var(--blue)}
.upload-zone svg{width:46px;height:46px;color:var(--blue);margin-bottom:10px}
.upload-zone .up-main{font-size:15.5px;font-weight:700;margin-bottom:4px}
.upload-zone .up-sub{font-size:12.5px;color:var(--ink-soft)}
.upload-zone input{display:none}
.preview-box{margin-top:14px;text-align:center}
.preview-box img{max-width:100%;max-height:300px;border-radius:12px;border:2px solid var(--line-strong)}
.scan-line{
  height:44px;margin-top:14px;border-radius:10px;overflow:hidden;position:relative;
  background:var(--blue-soft);display:flex;align-items:center;justify-content:center;
  color:var(--blue);font-size:13.5px;font-weight:700;
}
.scan-line .bar{position:absolute;left:0;right:0;height:3px;background:var(--blue);animation:scan 1.4s linear infinite}
@keyframes scan{0%{top:0}100%{top:100%}}
.ocr-result{margin-top:14px}
.ocr-field{margin-bottom:12px}
.ocr-field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px}
.ocr-field textarea,.ocr-field input{
  width:100%;padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:10px;
  background:var(--paper);font-size:13.5px;resize:vertical;line-height:1.6;
}
.ocr-field textarea:focus,.ocr-field input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ===== 按钮 ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 22px;border-radius:11px;font-size:14px;font-weight:700;transition:.15s;
}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 3px 10px rgba(214,69,65,.3)}
.btn-primary:hover{background:#C23B37}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(59,110,165,.3)}
.btn-blue:hover{background:#32608F}
.btn-ghost{background:var(--card);border:1.5px solid var(--line-strong);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:7px 14px;font-size:12.5px;border-radius:9px}

/* ===== 详情页 ===== */
.detail-stem{font-size:15.5px;line-height:1.9;font-family:"LXGW WenKai Screen",serif;margin-bottom:16px}
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa-box{border-radius:12px;padding:14px;border:1.5px solid}
.qa-box .qa-t{font-size:12px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.qa-box .qa-c{font-size:13px;line-height:1.7}
.qa-box.wrong{background:var(--red-soft);border-color:#EBC4C1}
.qa-box.wrong .qa-t{color:var(--red)}
.qa-box.right{background:var(--blue-soft);border-color:#BFD4EA}
.qa-box.right .qa-t{color:var(--blue)}
.qa-box.reason{background:var(--amber-soft);border-color:#E6D2A8;grid-column:1/-1}
.qa-box.reason .qa-t{color:var(--amber)}
.action-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

/* ===== 聊天 ===== */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:470px}
.stem-strip{
  background:var(--paper-deep);border-left:1.5px solid var(--line);border-right:1.5px solid var(--line);
  padding:0 18px;cursor:pointer;user-select:none;
}
.stem-head{display:flex;align-items:center;gap:8px;padding:8px 0 6px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.stem-head svg{width:15px;height:15px;color:var(--red)}
.stem-head .st-toggle{margin-left:auto;transition:.2s;color:var(--ink-faint)}
.stem-strip.fold .st-toggle{transform:rotate(-90deg)}
.stem-body{
  font-family:"LXGW WenKai Screen",serif;font-size:14px;line-height:1.85;color:var(--ink);
  padding:0 0 12px;border-top:1.5px dashed var(--line-strong);padding-top:9px;
}
.stem-strip.fold .stem-body{display:none}
.chat-head{
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;
  padding:11px 18px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);
}
.chat-head .t{font-size:14px;font-weight:700}
.chat-head .s{font-size:11px;color:var(--ink-soft)}
.ai-dot{
  width:34px;height:34px;border-radius:50%;background:var(--red-soft);
  display:flex;align-items:center;justify-content:center;color:var(--red);flex-shrink:0;
  border:1.5px solid #EBC4C1;
}
.chat-body{
  flex:1;overflow-y:auto;padding:18px;background:var(--card);
  border-left:1.5px solid var(--line);border-right:1.5px solid var(--line);
  display:flex;flex-direction:column;gap:14px;
}
.msg{display:flex;gap:10px;max-width:88%}
.msg .bubble{padding:12px 16px;border-radius:14px;font-size:15px;line-height:1.85;white-space:pre-wrap}
.msg.ai{align-self:flex-start}
.msg.ai .bubble{background:var(--paper-deep);border:1.5px solid var(--line);border-top-left-radius:4px}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.user .bubble{background:var(--blue);color:#fff;border-top-right-radius:4px}
.msg .mini-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.msg.ai .mini-av{background:var(--red)}
.msg.user .mini-av{background:var(--blue-soft);color:var(--blue)}
.typing .bubble{display:flex;gap:4px;align-items:center;padding:14px 16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.hint-card{
  background:var(--amber-soft);border:1.5px solid #E6D2A8;border-radius:12px;
  padding:10px 14px;font-size:12px;color:#8A641F;display:flex;gap:8px;align-items:flex-start;
}
.chat-input{
  display:flex;gap:10px;padding:12px;background:var(--card);
  border:1.5px solid var(--line);border-top:none;border-radius:0 0 var(--radius) var(--radius);
}
.chat-input input{
  flex:1;padding:11px 14px;border:1.5px solid var(--line-strong);border-radius:11px;
  background:var(--paper);font-size:13.5px;
}
.chat-input input:focus{outline:2px solid var(--blue);border-color:var(--blue)}

/* ===== 付费 ===== */
.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pay-card{
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);position:relative;transition:.15s;text-align:left;
}
.pay-card:hover{border-color:var(--line-strong)}
.pay-card.hot{border-color:var(--red);box-shadow:var(--shadow-lg)}
.pay-card.hot::after{
  content:"推荐";position:absolute;top:-10px;right:14px;
  background:var(--red);color:#fff;font-size:11px;font-weight:700;
  padding:2px 10px;border-radius:8px;
}
.pay-card .pc-name{font-size:14.5px;font-weight:700}
.pay-card .pc-price{font-size:30px;font-weight:700;margin:10px 0 2px;font-family:"LXGW WenKai Screen",serif}
.pay-card .pc-price small{font-size:14px;color:var(--ink-soft);font-weight:500}
.pay-card .pc-note{font-size:12px;color:var(--ink-soft);margin-bottom:12px}
.pay-card ul{list-style:none;font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;display:flex;flex-direction:column;gap:6px}
.pay-card li{display:flex;gap:6px;align-items:flex-start}
.pay-card li svg{width:14px;height:14px;color:var(--green);flex-shrink:0;margin-top:3px}
.pay-note{font-size:12px;color:var(--ink-faint);margin-top:14px;display:flex;gap:6px;align-items:center;justify-content:center}

/* ===== 付费墙 ===== */
.wall{
  text-align:center;padding:36px 22px;
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
}
.wall .lock{width:60px;height:60px;border-radius:50%;background:var(--amber-soft);color:var(--amber);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.wall .lock svg{width:28px;height:28px}
.wall h3{font-size:17px;margin-bottom:6px}
.wall p{font-size:13px;color:var(--ink-soft);margin-bottom:18px}

/* ===== 登录 ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{
  width:100%;max-width:400px;background:var(--card);
  border:1.5px solid var(--line);border-radius:20px;padding:34px 30px;box-shadow:var(--shadow-lg);
}
.login-logo{display:flex;flex-direction:column;align-items:center;margin-bottom:26px}
.login-logo .brand-mark{width:54px;height:54px;border-radius:14px;margin-bottom:12px}
.login-logo .brand-mark svg{width:30px;height:30px}
.login-logo h1{font-size:21px;font-weight:700}
.login-logo p{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
.login-field input{
  width:100%;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:11px;
  background:var(--paper);font-size:14px;
}
.login-field input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.login-demo{
  margin-top:14px;text-align:center;font-size:12px;color:var(--ink-faint);
  background:var(--paper-deep);border-radius:10px;padding:9px;cursor:pointer;transition:.15s;
}
.login-demo:hover{color:var(--blue)}

/* ===== 通话模式 ===== */
.mode-switch{display:flex;gap:6px;background:var(--paper-deep);border:1.5px solid var(--line);border-radius:11px;padding:4px;margin-bottom:14px}
.mode-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink-soft);transition:.15s}
.mode-btn svg{width:16px;height:16px}
.mode-btn.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.call-wrap{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:470px}
.call-head{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1.5px solid var(--line);background:var(--paper-deep)}
.call-avatar{width:36px;height:36px;border-radius:50%;background:var(--red-soft);border:1.5px solid #EBC4C1;display:flex;align-items:center;justify-content:center;color:var(--red);position:relative;flex-shrink:0}
.call-avatar.ringing::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--red);opacity:.5;animation:ring 1.6s infinite}
@keyframes ring{0%{transform:scale(.92);opacity:.6}70%{transform:scale(1.08);opacity:0}100%{opacity:0}}
.call-avatar svg{width:19px;height:19px}
.call-info{flex:1;min-width:0}
.call-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.call-title{font-size:14px;font-weight:700}
.call-actions{display:flex;align-items:center;gap:6px}
.call-mini{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;border:none;cursor:pointer;color:#fff;transition:.15s}
.call-mini svg{width:14px;height:14px}
.call-mini em{font-style:normal}
.call-mini.talk{background:var(--green);box-shadow:0 2px 8px rgba(76,138,92,.35)}
.call-mini.talk.listening{background:var(--amber);box-shadow:0 2px 8px rgba(201,138,45,.4)}
.call-mini.end{background:var(--red);box-shadow:0 2px 8px rgba(214,69,65,.35)}
.call-mini.end:hover{background:#C23B37}
.call-mini:active{transform:scale(.94)}
.call-status{font-size:11px;color:var(--ink-soft);margin-top:2px}
.call-status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:1px}
.call-status .dot.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.call-timer{font-family:"LXGW WenKai Screen",serif;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-left:auto;flex-shrink:0}
.call-body{flex:1;overflow-y:auto;padding:18px 20px 14px;display:flex;flex-direction:column;gap:12px;background:var(--card)}
.call-bubble{max-width:88%;padding:12px 16px;border-radius:14px;font-size:15px;line-height:1.85;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.call-bubble.ai{align-self:flex-start;background:var(--paper-deep);border:1.5px solid var(--line);border-top-left-radius:4px}
.call-bubble.user{align-self:flex-end;background:var(--blue);color:#fff;border-top-right-radius:4px}
.call-bubble.user-stream{align-self:flex-end;background:var(--blue);color:#fff;border-top-right-radius:4px;opacity:.85}
.call-bubble.user-stream .cb-tag{color:#DFF0FF}
.call-bubble.ai-stream{align-self:flex-start;background:var(--paper-deep);border:1.5px solid var(--line);border-top-left-radius:4px;opacity:.85}
.call-bubble .cb-tag{display:block;font-size:10px;font-weight:700;opacity:.6;margin-bottom:4px}
.call-bubble.ai .cb-tag{color:var(--red)}
.call-bubble.user .cb-tag{color:#DFF0FF}
.call-stage{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 18px 10px}
.wave-row{display:flex;align-items:center;gap:5px;height:30px}
.wave-row i{width:4px;border-radius:3px;background:var(--blue);animation:wave 1s ease-in-out infinite}
.wave-row i:nth-child(1){height:10px}.wave-row i:nth-child(2){height:18px;animation-delay:.1s}
.wave-row i:nth-child(3){height:26px;animation-delay:.2s}.wave-row i:nth-child(4){height:18px;animation-delay:.3s}
.wave-row i:nth-child(5){height:10px;animation-delay:.4s}
@keyframes wave{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
.wave-row.static i{animation:none;transform:scaleY(.45);background:var(--line-strong)}
.stage-hint{font-size:12.5px;color:var(--ink-soft)}
.stage-hint b{color:var(--ink)}
.engine-bar{display:flex;align-items:center;gap:8px;padding:6px 16px;background:var(--paper-deep);border-top:1.5px solid var(--line);font-size:11px;color:var(--ink-soft);flex-wrap:wrap}
.engine-badge{font-weight:700;padding:2px 8px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}
.engine-badge.demo{background:var(--amber-soft);color:var(--amber)}
.engine-edit{margin-left:auto;font-weight:700;color:var(--blue);cursor:pointer}
.engine-edit:hover{text-decoration:underline}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1.5px dashed var(--line);cursor:pointer}
.set-row:last-of-type{border-bottom:none}
.set-icon{width:38px;height:38px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.set-icon svg{width:19px;height:19px}
.set-label{font-size:14px;font-weight:600;color:var(--ink);flex:1}
.set-value{font-size:12px;color:var(--ink-soft)}
.set-arrow{color:var(--ink-faint);display:flex}
.set-arrow svg{width:15px;height:15px}
.voice-settings{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.voice-settings h3{font-size:15px;font-weight:700;margin-bottom:4px}
.voice-settings .vs-sub{font-size:12px;color:var(--ink-soft);margin-bottom:14px}
.vs-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.vs-field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px}
.vs-field input{width:100%;padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--paper);font-size:13px}
.vs-field input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.vs-note{font-size:11.5px;color:var(--ink-faint);margin-top:10px;line-height:1.7}
@media (max-width:640px){
  .vs-row{grid-template-columns:1fr}
  .call-wrap{height:calc(100vh - 190px)}
}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:var(--paper);padding:11px 22px;border-radius:999px;
  font-size:13px;z-index:100;transition:.3s;opacity:0;pointer-events:none;box-shadow:var(--shadow-lg);
  max-width:86vw;text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.banner{
  background:var(--amber-soft);border:1.5px solid #E6D2A8;color:#8A641F;
  border-radius:12px;padding:10px 14px;font-size:12.5px;margin-bottom:16px;display:flex;gap:9px;align-items:center;
}
.banner svg{width:17px;height:17px;flex-shrink:0}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);margin-bottom:14px;cursor:pointer}
.back-link:hover{color:var(--ink)}
.back-link svg{width:16px;height:16px}

/* ===== 响应式 ===== */
@media (max-width:860px){
  .layout{flex-direction:column;padding:16px 14px 90px}
  .sidebar{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;z-index:60;
    flex-direction:row;background:rgba(255,253,248,.96);backdrop-filter:blur(10px);
    border-top:2px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    justify-content:space-around;align-self:auto;gap:0;
  }
  .nav-item{flex-direction:column;gap:3px;padding:7px 10px;font-size:10.5px;border-radius:10px;flex:1;justify-content:center;border:none}
  .nav-item svg{width:21px;height:21px}
  .nav-item.active{background:var(--paper-deep);box-shadow:none}
  .stat-grid{grid-template-columns:repeat(3,1fr);gap:10px}
  .stat-card{padding:13px 10px}
  .stat-card .num{font-size:23px}
  .entry-grid{grid-template-columns:1fr 1fr;gap:10px}
  .entry{padding:14px;flex-direction:column;gap:9px}
  .entry .go{display:none}
  .pay-grid{grid-template-columns:1fr}
  .qa-grid{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .chat-wrap{height:calc(100vh - 150px)}
  .msg{max-width:92%}
}
@media (max-width:640px){
  body{font-size:15px}
  input,textarea{font-size:16px}
}
@media (max-width:420px){
  .entry-grid{grid-template-columns:1fr}
  .stat-card .num{font-size:20px}
  .page-title{font-size:20px}
}

function viewScan(){
  return shell(`

    <p class="page-sub">拍一张卷子 / 练习册，AI 自动提取题目、识别错因</p>
    <div class="card">
      ${state.preview?'':`<div class="upload-zone" id="dropzone" onclick="$('#file-input').click()">
        ${ICONS.scan}

        <div class="up-sub">支持 JPG / PNG，建议光线充足、题目完整</div>
        <input type="file" id="file-input" accept="image/*" onchange="handleFile(this)">
      </div>`}
      ${state.preview?`<div class="preview-box"><img id="preview-img" src="${state.preview}">${state.recognizing?'<div class="scan-line" id="scanline"><div class="bar"></div>AI 正在识别题目…</div>':''}</div>`:''}
      ${state.ocrResult? ocrResultForm() : ''}
      ${state.preview && !state.ocrResult && !state.recognizing? `<button class="btn btn-primary btn-block" style="margin-top:14px" onclick="runOcr()" id="ocr-btn">${ICONS.scan}开始识别</button>` : ''}
      ${state.preview && !state.ocrResult? `<button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="resetScan()">重新选择图片</button>` : ''}
    </div>
  `);
}
function resetScan(){ state.preview=null; state.ocrResult=null; state.recognizing=false; render(); }
function handleFile(input){
  const f = input.files && input.files[0];
  if(!f) return;
  if(!/^image\//.test(f.type)){ toast('请选择图片文件'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    state.preview = e.target.result;
    state.ocrResult = null;
    state.recognizing = false;
    render();
  };
  reader.readAsDataURL(f);
}
function runOcr(){
  state.recognizing = true;
  render();
  setTimeout(()=>{
    state.recognizing = false;
    state.ocrResult = {
      stem:'已知二次函数 y = x² - 2x - 3，求其顶点坐标。',
      answer:'顶点为 (1, -4)',
      wrongAnswer:'(-1, -4)',
      subject:'数学', diff:'中等', tag:'二次函数',
      reason:'公式记忆错误'
    };
    render();
    toast('识别完成，请核对内容后加入错题本');
  }, 2200);
}
function ocrResultForm(){
  const r = state.ocrResult;
  return `<div class="ocr-result card" style="margin-top:14px">
    <div class="section-title">识别结果（可编辑核对）</div>
    <div class="ocr-field"><label>题目内容</label><textarea rows="3" id="ocr-stem">${esc(r.stem)}</textarea></div>
    <div class="form-row">
      <div class="ocr-field"><label>我的错误答案</label><input id="ocr-wrong" value="${esc(r.wrongAnswer)}"></div>
      <div class="ocr-field"><label>正确答案</label><input id="ocr-right" value="${esc(r.answer)}"></div>
    </div>
    <div class="form-row">
      <div class="ocr-field"><label>科目</label><input id="ocr-subject" value="${esc(r.subject)}"></div>
      <div class="ocr-field"><label>错因</label><input id="ocr-reason" value="${esc(r.reason)}"></div>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:6px" onclick="saveOcr()">${ICONS.check}确认并加入错题本</button>
  </div>`;
}
function saveOcr(){
  const r = state.ocrResult;
  const stem = $('#ocr-stem').value.trim();
  if(!stem){ toast('题目内容不能为空'); return; }
  const now = new Date();
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const dd = String(now.getDate()).padStart(2,'0');
  MISTAKES.unshift({
    id:'m'+Date.now(),
    subject: $('#ocr-subject').value.trim() || '数学',
    diff:'中等',
    status:'pending',
    stem,
    wrongAnswer: $('#ocr-wrong').value.trim() || '—',
    analysis: $('#ocr-right').value.trim() || '—',
    reason: $('#ocr-reason').value.trim() || '待定位',
    date: mm+'-'+dd,
    tag:'新录入'
  });
  state.preview=null; state.ocrResult=null; state.recognizing=false;
  toast('已加入错题本');
  navigate('mistakes');
}

/* ===== 语音引擎 ===== */
/* ---------- 火山引擎 Seeduplex 3.0 实时语音（正式版，经 voice-proxy 代理） ---------- */
const VolcVoice = {
  ws: null, ac: null, playAc: null, proc: null, stream: null,
  micOn: false, pcmBuf: [], pcmLen: 0, playQueue: [], playing: false,
  audioPlayer: null,
  started: false, connected: false, sessionId: '', aiStream: '', userStream: '', userStreamShown: false,

  async start(m){
    const cfg = state.volc || {};
    const proxy = (cfg.proxy||'').trim();
    if(!proxy){ toast('请先在「配置」里填写代理地址'); return; }
    let url = proxy;
    if(!/^wss?:\/\//i.test(url)) url = 'wss://' + url;
    this.cleanup();
    this.started = true;
    state.callOn = true;
    state.callTimer = 0;
    render();
    startCallTimer();
    renderCallStatus('正在连接 AI 导师…');
    try{
      this.ws = new WebSocket(url);
    }catch(e){
      toast('代理地址格式错误：' + proxy);
      this.cleanup(); state.callOn = false; render(); return;
    }
    this.ws.onopen = () => {
      const stem = m ? m.stem : '';
      const inst = '你是「思维引导式辅导老师」，正在用打电话的方式辅导一名中学生。\n'
        + '教学原则：绝不直接给出答案或完整解法。每次只提一个启发性的小问题，引导学生自己说出思路、发现错误、推出结论。\n'
        + '对话风格：亲切、耐心、口语化，像真人老师打电话一样自然，每轮回复不超过 3 句话。学生答对关键一步时明确肯定，再引导下一步。\n'
        + '当前辅导的题目：' + (stem || '学生自由提问，先了解他想问什么');
      this.send({ type:'session.create', session:{
        model:'1.2.6.1', instructions: inst,
        audio:{
          input:{ format:{ type:'pcm', rate:16000 } },
          output:{ format:{ type:'pcm_s16le', rate:24000 },
            voice:(cfg.voice||'zh_female_vv_jupiter_bigtts'), speed:-15, loudness:0 }
        }
      }});
    };
    this.ws.onmessage = e => this.handleMsg(e.data);
    this.ws.onclose = () => {
      if(!this.started) return;
      toast('语音连接已断开');
      this.cleanup(); state.callOn = false; render();
    };
    this.ws.onerror = () => {
      if(!this.started) return;
      toast('无法连接语音服务，请检查代理地址');
      this.cleanup(); state.callOn = false; render();
    };
  },

  send(obj){ if(this.ws && this.ws.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify(obj)); },

  handleMsg(raw){
    let msg; try{ msg = JSON.parse(raw); }catch(e){ return; }
    const t = msg.type || '';
    if(t === 'session.created'){
      this.connected = true;
      this.sessionId = (msg.session && msg.session.id) || '';
      renderCallStatus('已接通，请直接说话');
      this.audioPlayer = makePcmPlayer();
      this.openMic();
      const hi = state.chatMistake
        ? '你好，我看到你在这道题上卡住了。先别急，说说你的思路，我们一步一步来。'
        : '你好，我是你的 AI 辅导老师。想聊哪道题，直接说就行。';
      pushCallLog('ai', hi);
      this.send({ type:'speech_text_buffer.commit', text:hi });
    }
    else if(t === 'conversation.item.input_audio_transcription.delta'){
      // 流式中间态不可靠（碎片+重复），不累积展示，仅更新状态提示
      this.userStream = (msg.delta || msg.text || '').trim();
      const hint = $('#stage-hint');
      if(hint) hint.innerHTML = '<b>正在识别…</b>';
    }
    else if(t === 'conversation.item.input_audio_transcription.completed'){
      const txt = cleanAsrText(msg.text || msg.transcript || this.userStream);
      // 移除可能残留的流式占位气泡，只落最终完整文本
      const idx = state.callLog.findIndex(l=>l.role === 'user-stream');
      if(idx >= 0) state.callLog.splice(idx, 1);
      if(txt){ pushCallLog('user', txt); }
      this.userStream = ''; this.userStreamShown = false;
      renderCallLog();
    }
    else if(t === 'response.output_text.delta'){
      const txt = (msg.delta || msg.text || '').trim();
      if(txt){
        this.aiStream = mergeDelta(this.aiStream, txt);
        const last = state.callLog[state.callLog.length-1];
        if(!last || (last.role !== 'ai-stream' && last.role !== 'ai')){
          state.callLog.push({ role:'ai-stream', text:this.aiStream });
        } else if(last.role === 'ai-stream'){ last.text = this.aiStream; }
        else if(last.role === 'ai'){ state.callLog.push({ role:'ai-stream', text:this.aiStream }); }
        renderCallLog();
      }
    }
    else if(t === 'response.output_audio.delta'){
      const b64 = msg.delta || msg.audio || '';
      if(b64){ this.audioPlayer && this.audioPlayer.enqueue(b64ToBytes(b64)); }
    }
    else if(t === 'response.output_audio.done' || t === 'response.done'){
      flushAiStream();
    }
    else if(t === 'error'){
      toast('语音服务：' + (msg.message || msg.error || '出错了'));
    }
  },

  async openMic(){
    if(this.micOn) return;
    try{
      this.stream = await navigator.mediaDevices.getUserMedia({ audio:{
        channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true
      }});
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ac = new AC({ sampleRate:16000 });
      await this.ac.resume();
      const src = this.ac.createMediaStreamSource(this.stream);
      this.proc = this.ac.createScriptProcessor(4096, 1, 1);
      this.proc.onaudioprocess = e => {
        this.onAudio(e.inputBuffer.getChannelData(0));
        // 关键：ScriptProcessor 输出必须显式静音，否则会把麦克风信号回放到扬声器造成回声/沙沙声
        try{ e.outputBuffer.getChannelData(0).fill(0); }catch(err){}
      };
      src.connect(this.proc);
      this.proc.connect(this.ac.destination);
      this.micOn = true;
      state.callListening = true;
      renderWave();
    }catch(err){
      toast('无法打开麦克风：' + (err && err.name === 'NotAllowedError' ? '请在浏览器设置中允许麦克风权限' : '请检查麦克风设备'));
      state.callListening = false;
      renderWave();
    }
  },

  closeMic(){
    this.micOn = false;
    if(this.proc){ try{ this.proc.disconnect(); }catch(e){} this.proc = null; }
    if(this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream = null; }
    if(this.ac){ try{ this.ac.close(); }catch(e){} this.ac = null; }
    state.callListening = false;
  },

  onAudio(f32){
    const n = f32.length;
    const out = new Int16Array(n);
    for(let i=0;i<n;i++){
      let v = f32[i]; if(v>1) v=1; else if(v<-1) v=-1;
      out[i] = v<0 ? v*0x8000 : v*0x7FFF;
    }
    this.pcmBuf.push(out);
    this.pcmLen += n;
    while(this.pcmLen >= 320){
      const pkt = new Int16Array(320);
      let off = 0;
      while(off < 320){
        const first = this.pcmBuf[0];
        const take = Math.min(first.length, 320 - off);
        pkt.set(first.subarray(0, take), off);
        if(take === first.length) this.pcmBuf.shift();
        else this.pcmBuf[0] = first.subarray(take);
        off += take;
      }
      this.pcmLen -= 320;
      this.send({ type:'input_audio_buffer.append', audio:b64FromI16(pkt) });
    }
  },

  interrupt(){
    this.send({ type:'response.cancel' });
    if(this.audioPlayer){ try{ this.audioPlayer.stop(); }catch(e){} }
  },

  cleanup(){
    this.started = false; this.connected = false;
    this.closeMic();
    if(this.ws){ try{ this.ws.onclose = null; this.ws.close(); }catch(e){} this.ws = null; }
    if(this.audioPlayer){ try{ this.audioPlayer.stop(); }catch(e){} this.audioPlayer = null; }
    this.aiStream = ''; this.userStream = ''; this.userStreamShown = false;
  }
};
/* pcm_s16le 流式播放器（AudioContext 手动解码，全平台兼容） */
function makePcmPlayer(){
  const p = {
    ac: null, playing: false, queue: [],
    ensure(){
      if(!this.ac || this.ac.state === 'closed'){
        this.ac = new (window.AudioContext || window.webkitAudioContext)({ sampleRate:24000 });
      }
      return this.ac;
    },
    enqueue(bytes){
      if(!bytes || !bytes.length) return;
      this.queue.push(bytes.slice());
      this.pump();
    },
    pump(){
      if(this.playing || !this.queue.length) return;
      const bytes = this.queue.shift();
      this.playing = true;
      this.playBytes(bytes).finally(()=>{ this.playing = false; this.pump(); });
    },
    async playBytes(bytes){
      try{
        const ac = this.ensure();
        await ac.resume();
        const i16 = new Int16Array(bytes.buffer, bytes.byteOffset, bytes.length >> 1);
        const f32 = new Float32Array(i16.length);
        for(let i=0;i<i16.length;i++) f32[i] = i16[i]/32768;
        const buf = ac.createBuffer(1, f32.length, 24000);
        buf.copyToChannel(f32, 0);
        const src = ac.createBufferSource();
        src.buffer = buf;
        src.connect(ac.destination);
        await new Promise(res=>{ src.onended = res; src.start(); });
      }catch(e){ /* 播放失败忽略 */ }
    },
    stop(){
      this.queue = [];
      if(this.ac){ try{ this.ac.close(); }catch(e){} this.ac = null; }
      this.playing = false;
    }
  };
  return p;
}
function b64FromI16(arr){
  const bytes = new Uint8Array(arr.buffer, arr.byteOffset, arr.byteLength);
  let bin = '';
  const CH = 0x8000;
  for(let i=0;i<bytes.length;i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  return btoa(bin);
}
function b64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
/* 流式文本去重合并：兼容「增量」与「累计」两种协议语义 */
function mergeDelta(prev, next){
  if(!prev) return next;
  if(!next) return prev;
  // 累计语义：新文本以旧文本开头（或旧文本是新文本后缀）→ 直接用新文本
  if(next.startsWith(prev) || next.endsWith(prev)) return next;
  // 新文本完全包含旧文本 → 用新文本
  if(next.indexOf(prev) >= 0) return next;
  // 旧文本包含新文本（ASR 修正/回退）→ 用新文本
  if(prev.indexOf(next) >= 0) return next;
  // 增量语义：直接拼接
  return prev + next;
}
/* 识别文本清洗：去掉杂波（纯符号/过短/无意义碎片），保留中文与公式片段 */
function cleanAsrText(t){
  if(!t) return '';
  let s = String(t).replace(/[，。、；：？！,.!?;:\s]+$/g, '').trim();
  // 纯符号/空白 → 过滤（ASR 环境噪声常识别成这类）
  if(!/[\u4e00-\u9fa5A-Za-z0-9]/.test(s)) return '';
  // 过短碎片：无中文时需 ≥2 个字母数字；有中文时需 ≥2 个汉字（单字语气词/噪声碎片过滤）
  const hasCn = /[\u4e00-\u9fa5]/.test(s);
  const cnLen = (s.match(/[\u4e00-\u9fa5]/g)||[]).length;
  const alnumLen = (s.match(/[A-Za-z0-9]/g)||[]).length;
  if(hasCn ? cnLen < 2 : alnumLen < 2) return '';
  return s;
}
function pushCallLog(role, text){
  if(!text && role !== 'user-stream') return;
  state.callLog.push({ role, text });
  renderCallLog();
}
function flushAiStream(){
  if(!VolcVoice.aiStream) return;
  const last = state.callLog[state.callLog.length-1];
  if(last && last.role === 'ai-stream'){ last.role = 'ai'; renderCallLog(); }
  VolcVoice.aiStream = '';
}

function renderCallLog(){

  // 增量更新：复用已有节点，只更新新增/变化的文本，避免整块重绘导致闪烁

function toggleCallListening(){
  if(!state.callOn) return;
  if(getVolc()){ VolcVoice.interrupt(); return; }
  if(state.callListening){ stopRecognition(); state.callListening=false; renderWave(); return; }
  startRecognition();

function startRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    toast('当前环境不支持语音识别，建议用 Chrome/Edge 打开，或改用文字对话');
    return;
  }
  try{
    const rec = new SR();
    rec.lang = 'zh-CN';
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = e=>{
      const text = e.results[0][0].transcript.trim();
      if(!text) return;
      state.callLog.push({role:'user', text});
      renderCallLog();
      stopRecognition();
      state.callListening = false;
      renderWave();
      respondToUser(text);
    };
    rec.onerror = e=>{
      state.callListening = false;
      renderWave();
      if(e.error==='not-allowed') toast('麦克风权限被拒绝，请在浏览器设置中允许');
      else if(e.error==='no-speech') toast('没有听到声音，请靠近麦克风再说一次');
      else if(e.error!=='aborted') toast('语音识别失败：'+e.error);
    };
    rec.onend = ()=>{
      if(state.callListening){ state.callListening=false; renderWave(); }
    };
    state.rec = rec;
    state.callListening = true;
    renderWave();
    rec.start();
  }catch(err){ toast('无法启动语音识别'); }
}
function stopRecognition(){
  if(state.rec){ try{ state.rec.stop(); }catch(e){} state.rec = null; }
}
function renderWave(){
  const row = $('#wave-row');
  const hint = $('#stage-hint');
  if(!row) return;
  if(state.callListening){
    row.classList.remove('static');
    if(hint) hint.innerHTML = '<b>正在听你说话…</b> 说完稍等，我会追问';
  } else {
    row.classList.add('static');
    if(hint && state.callOn) hint.innerHTML = '<b>已接通。</b> 点击「说一句」说出你的思路';
  }
}
function respondToUser(text){
  const m = state.chatMistake;
  if(!m){ const t = '这个问题我们可以先聊聊你的想法，你准备从哪一步入手？'; aiSay(t); return; }
  state.typing = true;
  setTimeout(()=>{
    state.typing = false;
    const script = state.script || pickScript(m.reason);
    state.script = script;
    let reply;
    if(state.scriptIdx < script.length-1){
      state.scriptIdx++;
      reply = script[state.scriptIdx];
      if(state.scriptIdx === script.length-1){
        setTimeout(()=>{
          const done = '恭喜你，通过自己的思考把这道题讲通了。这道题现在可以标记为「已掌握」，也可以让我出 1 道同类题检验一下。';
          state.chatLog.push({role:'ai', text:done});
          state.callLog.push({role:'ai', text:done});
          renderCallLog();
          speakText(done);
        }, 500);
      }
    } else if(state.scriptIdx === script.length-1){
      reply = '你可以把完整过程说出来，我帮你检查每一步。';
    } else {
      reply = '嗯，说说你的思路，卡在哪一步？';
    }
    if(reply){
      state.chatLog.push({role:'ai', text:reply});
      state.callLog.push({role:'ai', text:reply});
      renderCallLog();
      speakText(reply);
    }
  }, 600);
}
function speakText(text){
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.95;
    const voices = window.speechSynthesis.getVoices();
    const zh = voices.find(v=>/zh|Chinese/i.test(v.lang));
    if(zh) u.voice = zh;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function startChat(id){

function toggleStem(){ state.stemOpen = !state.stemOpen; render(); }
function pickScript(reason){
  for(const s of SCRIPTS){
    if(s.match.some(k=>reason.includes(k))) return s.turns;
  }
  return DEFAULT_SCRIPT;
}
function aiSay(text){
  state.chatLog.push({role:'ai', text});
  renderChat();
}
function renderChat(){
  const body = $('#chat-body');
  if(!body) return;
  // 增量更新，避免每次重建所有消息导致闪烁
  const items = state.chatLog || [];
  while(body.children.length > items.length) body.removeChild(body.lastChild);
  items.forEach((l, i)=>{
    let node = body.children[i];
    if(!node){
      node = document.createElement('div');
      node.className = 'msg ' + l.role;
      node.innerHTML = `<span class="mini-av">${l.role==='ai'?'AI':'我'}</span><div class="bubble"></div>`;
      body.appendChild(node);
    }
    const bubble = node.querySelector('.bubble');
    if(bubble.textContent !== l.text) bubble.textContent = l.text;
  });
  // 打字指示器
  let typingNode = body.querySelector('.typing');
  if(state.typing && !typingNode){
    const t = document.createElement('div');
    t.className = 'msg ai typing';
    t.innerHTML = `<span class="mini-av">AI</span><div class="bubble"><i></i><i></i><i></i></div>`;
    body.appendChild(t);
  } else if(!state.typing && typingNode){
    typingNode.remove();
  }
  body.scrollTop = body.scrollHeight;
}
function sendChat(){
  const input = $('#chat-text');
  const text = input.value.trim();
  if(!text || state.typing) return;
  input.value='';
  state.chatLog.push({role:'user', text});

  state.typing = true;
  renderChat();
  setTimeout(()=>{
    state.typing = false;

      state.scriptIdx++;
      aiSay(script[state.scriptIdx]);

        setTimeout(()=>{ aiSay('恭喜你，通过自己的思考把这道题讲通了。这道题现在可以标记为「已掌握」，也可以让我出 1 道同类题检验一下。'); }, 600);
      }
    } else if(script && state.scriptIdx === script.length-1){
      aiSay('你可以把完整过程写出来发给我，我帮你检查每一步。');
    } else {
      aiSay('嗯，说说你的思路，卡在哪一步？');

  }, 900);
}
function initChatScript(){
