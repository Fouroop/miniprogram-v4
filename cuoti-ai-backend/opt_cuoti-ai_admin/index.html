<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>错题AI辅导 · 管理后台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toast"></div>

  <!-- 登录页 -->
  <div id="loginPage" class="login-wrap" style="display:none">
    <div class="login-box">
      <h1>错题AI辅导</h1>
      <p class="sub">管理后台登录</p>
      <label>管理员账号</label>
      <input id="loginUser" placeholder="admin">
      <label>密码</label>
      <input id="loginPass" type="password" placeholder="请输入密码">
      <div class="err" id="loginErr"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:16px;padding:11px" onclick="doLogin()">登 录</button>
    </div>
  </div>

  <!-- 主布局 -->
  <div id="mainLayout" class="layout" style="display:none">
    <aside class="sidebar">
      <div class="logo">错题AI后台<small>Cuoti AI Admin</small></div>
      <div class="nav-item active" data-page="dashboard" onclick="navTo('dashboard')">数据概览</div>
      <div class="nav-item" data-page="users" onclick="navTo('users')">用户管理</div>
      <div class="nav-item" data-page="applies" onclick="navTo('applies')">申请管理<span class="badge" id="badgeApplies" style="display:none"></span></div>
      <div class="nav-item" data-page="llm" onclick="navTo('llm')">大模型管理</div>
      <div class="nav-item" data-page="conversations" onclick="navTo('conversations')">对话管理</div>
      <div class="nav-item" data-page="questions" onclick="navTo('questions')">题库管理</div>
      <div class="nav-item" data-page="mistakes" onclick="navTo('mistakes')">错题管理</div>
      <div class="nav-item" data-page="knowledge" onclick="navTo('knowledge')">知识大纲</div>
      <div class="nav-item" data-page="voicepack" onclick="navTo('voicepack')">语音包管理</div>
      <div class="nav-item" data-page="volc" onclick="navTo('volc')">火山用量</div>
      <div class="nav-item" data-page="wxpay" onclick="navTo('wxpay')">微信支付</div>
      <div class="nav-item" data-page="voice" onclick="navTo('voice')">语音引擎设置</div>
    </aside>
    <main class="main">
      <div class="topbar">
        <h2 id="pageTitle">数据概览</h2>
        <div class="user-info">
          <span id="adminName"></span>
          <button class="btn btn-sm" onclick="doLogout()">退出登录</button>
        </div>
      </div>
      <div id="content"></div>
    </main>
  </div>

  <!-- 通用弹窗 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <h3 id="modalTitle">编辑</h3>
      <div id="modalBody"></div>
      <div class="actions">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" id="modalOkBtn">确定</button>
      </div>
    </div>
  </div>

  <script>
    // 部署前缀：公网 /api 被其他服务占用时，通过 /cuoti/ 前缀访问本系统
    window.__CUOTI_API_PREFIX__ = window.location.pathname.startsWith('/cuoti/') ? '/cuoti' : '';
  </script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/users.js"></script>
  <script src="js/applies.js"></script>
  <script src="js/llm.js"></script>
  <script src="js/conversations.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/mistakes.js"></script>
  <script src="js/knowledge.js"></script>
  <script src="js/voice-pack.js"></script>
  <script src="js/volc.js"></script>
  <script src="js/wxpay.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
